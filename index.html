<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Aluno Maker Digital — Robótica educacional para escolas públicas em Brasília. Em breve no ar. Tecnologia que transforma vidas.">
  <meta name="author" content="Professor Francenylson — Aluno Maker Digital">
  <title>Em Breve — Aluno Maker Digital</title>
  <style>
    :root {
      --bg-primary:    #0a0e1a;
      --blue-electric: #00e5ff;
      --text-primary:  #e0e8ff;
      --text-secondary: #7090b0;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-primary);
      font-family: system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }

    main {
      max-width: 640px;
      width: 100%;
    }

    h1 {
      font-size: clamp(1.75rem, 6vw, 3rem);
      color: var(--blue-electric);
      letter-spacing: 0.04em;
      margin-bottom: 1.25rem;
    }

    p {
      color: var(--text-secondary);
      font-size: clamp(1rem, 2.5vw, 1.2rem);
      line-height: 1.6;
      margin-bottom: 0.75rem;
    }

    .slogan {
      color: var(--text-primary);
      font-size: clamp(1.1rem, 3vw, 1.35rem);
      font-style: italic;
      margin-top: 2rem;
      padding-top: 1.5rem;
      border-top: 1px solid rgba(0, 229, 255, 0.2);
    }

    footer {
      margin-top: 3rem;
      color: var(--text-secondary);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>Aluno Maker Digital</h1>
    <p>Estamos preparando algo incrível.</p>
    <p>Em breve, nossa plataforma de robótica educacional estará disponível para escolas públicas de Brasília.</p>
    <p class="slogan">Tecnologia que transforma vidas.</p>
  </main>
  <footer>
    <p>© 2018–2026 Professor Francenylson — Recanto das Emas, DF</p>
  </footer>
</body>
</html>
